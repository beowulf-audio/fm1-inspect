# Chord machine: the left white keys play scale-degree chords, the right white keys strum the last chord, a black key
# changes a chord, the PRESETS knob picks other sounds and the ALGORITHM knob switches to Strum mode (README "Controls").
name: chord-tour
ms: 12000
click_ms: 150
steps:
  - { at: 1500, screenshot: boot }
  - { at: 1700, note: F3, vel: 100, hold: 700 }
  - { at: 2500, note: F4, vel: 100, hold: 120 }
  - { at: 2580, note: G4, vel: 100, hold: 120 }
  - { at: 2660, note: A4, vel: 100, hold: 120 }
  - { at: 2740, note: B4, vel: 100, hold: 120 }
  - { at: 2820, note: C5, vel: 100, hold: 120 }
  - { at: 2900, note: D5, vel: 100, hold: 120 }
  - { at: 2980, note: E5, vel: 100, hold: 300 }
  - { at: 3500, note: B3, vel: 100, hold: 700 }
  - { at: 4400, note: C#4, vel: 100, hold: 900 }
  - { at: 4500, note: G3, vel: 100, hold: 700 }
  - { at: 5500, note: C4, vel: 100, hold: 700 }
  - { at: 6300, turn: PRESETS, clicks: 3 }
  - { at: 6900, note: A3, vel: 100, hold: 500 }
  - { at: 7500, note: G5, vel: 100, hold: 120 }
  - { at: 7600, note: F5, vel: 100, hold: 120 }
  - { at: 7700, note: E5, vel: 100, hold: 120 }
  - { at: 7800, note: D5, vel: 100, hold: 300 }
  - { at: 8300, press: FX }
  - { at: 9300, press: FX }
  - { at: 9500, turn: ALGORITHM, clicks: 2 }
  - { at: 10200, press: HOME }
  - { at: 10500, note: F3, vel: 100, hold: 400 }
  - { at: 11000, note: G3, vel: 100, hold: 700 }
  - { at: 11900, screenshot: end }
expect:
  boots: true
