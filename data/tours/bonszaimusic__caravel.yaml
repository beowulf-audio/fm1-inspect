# Plays HOME's first sound, turns PRESETS and KNOB 1 (cutoff), picks another engine (EDIT held + a white key), then
# step-records four notes on SEQ (REC, keys, REC), plays the pattern and shows the LFO and FX pages (docs "Start here").
name: caravel-tour
ms: 12500
click_ms: 150
steps:
  - { at: 1500, screenshot: boot }
  - { at: 1700, note: C4, hold: 400 }
  - { at: 2150, note: G4, hold: 400 }
  - { at: 2700, turn: PRESETS, clicks: 1 }
  - { at: 2900, note: C4, hold: 900 }
  - { at: 3000, turn: KNOB1, clicks: -5 }
  - { at: 4000, press: EDIT, hold: 900 }
  - { at: 4300, note: B3, hold: 150 }
  - { at: 5100, note: E4, hold: 400 }
  - { at: 5700, press: SEQ }
  - { at: 6100, press: REC }
  - { at: 6400, note: C4, hold: 120 }
  - { at: 6600, note: D#4, hold: 120 }
  - { at: 6800, note: G4, hold: 120 }
  - { at: 7000, note: A#4, hold: 120 }
  - { at: 7300, press: REC }
  - { at: 7600, press: PLAY }
  - { at: 9300, press: LFO }
  - { at: 10500, press: FX }
  - { at: 11800, press: HOME }
  - { at: 12300, screenshot: end }
expect:
  boots: true
