# FOMAJAM: starts the pattern and walks the pages while it plays (README "Playing it"): PATTERN grid (SEQ) on
# the nine tracks with SELECT, the next pattern queued with PRESETS, SOUND (EDIT), FX, the SCOPE page and MIX.
name: fomajam-tour
ms: 12000
click_ms: 150
steps:
  - { at: 1500, screenshot: boot }
  - { at: 1600, press: PLAY }
  - { at: 2300, press: SEQ }
  - { at: 3300, turn: SELECT, clicks: 1 }
  - { at: 4300, turn: SELECT, clicks: 1 }
  - { at: 5200, turn: SELECT, clicks: 6 }
  - { at: 6200, turn: PRESETS, clicks: 1 }
  - { at: 7000, press: EDIT }
  - { at: 7900, press: FX }
  - { at: 8600, press: HOME }
  - { at: 10000, press: HOME }
  - { at: 11800, screenshot: end }
expect:
  boots: true
