# S1Vave: a bass line on the PERFORM page, then the EDIT (OSC CORE), ENV, LFO and FX pages with a note on each,
# then two PRESETS turns with a chord and a phrase (docs/PANEL_GUIDE.md, "Page Navigation & Knob Assignments").
name: s1vave-tour
ms: 12000
click_ms: 150
steps:
  - { at: 2600, screenshot: boot }
  - { at: 2800, note: F3, vel: 110, hold: 180 }
  - { at: 3050, note: C4, vel: 110, hold: 180 }
  - { at: 3300, note: G#3, vel: 110, hold: 180 }
  - { at: 3550, note: G3, vel: 110, hold: 180 }
  - { at: 3800, note: A#3, vel: 110, hold: 180 }
  - { at: 4050, note: C4, vel: 110, hold: 250 }
  - { at: 4600, press: EDIT }
  - { at: 4900, note: G3, vel: 110, hold: 400 }
  - { at: 5600, press: ENV }
  - { at: 5900, note: D#4, vel: 110, hold: 400 }
  - { at: 6600, press: LFO }
  - { at: 6900, note: C4, vel: 110, hold: 400 }
  - { at: 7600, press: FX }
  - { at: 7900, note: G4, vel: 110, hold: 400 }
  - { at: 8600, press: HOME }
  - { at: 8900, turn: PRESETS, clicks: 2 }
  - { at: 9400, note: C4, vel: 100, hold: 400 }
  - { at: 9400, note: E4, vel: 100, hold: 400 }
  - { at: 9400, note: G4, vel: 100, hold: 400 }
  - { at: 10000, turn: PRESETS, clicks: 2 }
