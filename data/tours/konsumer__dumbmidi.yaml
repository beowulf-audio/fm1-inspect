# DUMBMIDI (a MIDI controller, no sound of its own): held chords named on the main page (CMAJ7, AMIN7, F6, G7, DMIN),
# the ARP and SCALE submenus, the MAP page (GLO) with SELECT moving through the controls, then HOME (README "Play").
name: dumbmidi
ms: 12000
click_ms: 150
steps:
  - { at: 1500, screenshot: boot }
  - { at: 1700, note: C4, vel: 100, hold: 900 }
  - { at: 1700, note: E4, vel: 100, hold: 900 }
  - { at: 1700, note: G4, vel: 100, hold: 900 }
  - { at: 1700, note: B4, vel: 100, hold: 900 }
  - { at: 2800, note: A3, vel: 100, hold: 900 }
  - { at: 2800, note: C4, vel: 100, hold: 900 }
  - { at: 2800, note: E4, vel: 100, hold: 900 }
  - { at: 2800, note: G4, vel: 100, hold: 900 }
  - { at: 3900, note: F3, vel: 100, hold: 900 }
  - { at: 3900, note: A3, vel: 100, hold: 900 }
  - { at: 3900, note: D4, vel: 100, hold: 900 }
  - { at: 3900, note: C5, vel: 100, hold: 900 }
  - { at: 5000, note: G3, vel: 100, hold: 900 }
  - { at: 5000, note: B3, vel: 100, hold: 900 }
  - { at: 5000, note: D4, vel: 100, hold: 900 }
  - { at: 5000, note: F4, vel: 100, hold: 900 }
  - { at: 6200, press: ARP }
  - { at: 7200, press: HOME }
  - { at: 7500, press: SCL }
  - { at: 8500, press: HOME }
  - { at: 8800, press: GLO }
  - { at: 9600, turn: SELECT, clicks: 4 }
  - { at: 10800, press: GLO }
  - { at: 11100, press: HOME }
  - { at: 11300, note: D4, vel: 100, hold: 600 }
  - { at: 11300, note: F4, vel: 100, hold: 600 }
  - { at: 11300, note: A4, vel: 100, hold: 600 }
  - { at: 11950, screenshot: end }
expect:
  boots: true
