# Hungry Travis: GLO serves a bean, the right white keys move the spoon and the left black key tips it to pour;
# two misses (WHOOPS!) make him angrier, and the SELECT knob turns the 3D scene (QUICKSTART.md "Feed Travis").
name: travis-tour
ms: 12000
click_ms: 150
steps:
  - { at: 1500, screenshot: boot }
  - { at: 1700, press: GLO }
  - { at: 2300, note: G5, hold: 600 }
  - { at: 3100, note: G5, hold: 600 }
  - { at: 3900, note: F5, hold: 300 }
  - { at: 4400, note: F#3, hold: 900 }
  - { at: 5600, screenshot: pour }
  - { at: 6500, press: GLO }
  - { at: 7000, turn: SELECT, clicks: 8 }
  - { at: 8400, turn: KNOB2, clicks: 4 }
  - { at: 9300, note: G5, hold: 700 }
  - { at: 10200, note: F#3, hold: 900 }
  - { at: 11800, screenshot: end }
expect:
  boots: true
