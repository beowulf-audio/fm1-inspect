# Drone synth: PLAY fades the two drones in, white keys recall preset scenes, a held key blends toward another,
# and the page buttons (HOME, ENV, EDIT, LFO, FX) show the drone pages (README "Start here", "Pages").
name: niagara-tour
ms: 12000
click_ms: 150
steps:
  - { at: 1500, screenshot: boot }
  - { at: 2200, press: PLAY }
  - { at: 3800, note: A3, vel: 100, hold: 200 }
  - { at: 4800, press: HOME }
  - { at: 5600, note: C4, vel: 100, hold: 200 }
  - { at: 6200, press: ENV }
  - { at: 6900, note: B4, vel: 120, hold: 1200 }
  - { at: 7400, press: EDIT }
  - { at: 8400, press: LFO }
  - { at: 9200, note: E4, vel: 100, hold: 200 }
  - { at: 9800, press: FX }
  - { at: 10600, press: HOME }
  - { at: 10700, turn: KNOB1, clicks: 3 }
  - { at: 11900, screenshot: end }
expect:
  boots: true
