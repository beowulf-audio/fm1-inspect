# After the boot splash: a few notes in Bardic Crafting, then HOME + PLAY into Encounter, scenes on white keys
# (TAVERN, then WILDERNESS), a black-key variation (KEY+), and SEQ for Freestyle with a melody over the scene.
name: emb-tour
ms: 14000
click_ms: 150
steps:
  - { at: 1400, screenshot: boot }
  - { at: 3900, note: D4, hold: 250 }
  - { at: 4200, note: F4, hold: 250 }
  - { at: 4500, note: A4, hold: 400 }
  - { at: 5100, press: HOME, hold: 500 }
  - { at: 5250, press: PLAY }
  - { at: 6000, note: F3, hold: 200 }
  - { at: 8300, note: C4, hold: 200 }
  - { at: 10300, note: C#4, hold: 200 }
  - { at: 11600, press: SEQ }
  - { at: 12000, note: A4, hold: 200 }
  - { at: 12300, note: C5, hold: 200 }
  - { at: 12600, note: E5, hold: 400 }
  - { at: 13800, screenshot: end }
expect:
  boots: true
