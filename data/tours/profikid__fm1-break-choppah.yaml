# CHOPPAH: PLAY starts the Amen; slices on the white keys, the 1/16 roll and tape-stop pads held on the black keys,
# HOME's PERFORM and GENERATOR pages, ALGORITHM to the next break, the SEQ pattern page and the FX chain (README "Panel").
name: choppah
ms: 12000
click_ms: 150
steps:
  - { at: 1500, screenshot: boot }
  - { at: 1700, press: PLAY }
  - { at: 2600, note: F3, vel: 110, hold: 200 }
  - { at: 2900, note: A3, vel: 110, hold: 200 }
  - { at: 3200, note: C4, vel: 110, hold: 200 }
  - { at: 3500, note: E4, vel: 110, hold: 200 }
  - { at: 3900, note: G#3, vel: 110, hold: 700 }
  - { at: 4900, note: G#4, vel: 110, hold: 800 }
  - { at: 6000, press: HOME, hold: 150 }
  - { at: 6800, press: HOME, hold: 150 }
  - { at: 7600, turn: ALGORITHM, clicks: 1 }
  - { at: 8800, press: SEQ, hold: 150 }
  - { at: 10000, press: FX, hold: 150 }
  - { at: 11800, screenshot: end }
expect:
  boots: true
