# Plays notes while SELECT and ALGO step through synthesis models on HOME (a drum model in bank C), visits the pages
# from the manual's button table (SCL, FX, ENV, LFO, EDIT, GLO), then on HOME switches to DRONE and turns K1 and K2.
name: gator-tour
ms: 12500
click_ms: 150
steps:
  - { at: 1500, screenshot: boot }
  - { at: 1700, note: C4, vel: 100, hold: 300 }
  - { at: 2000, note: G4, vel: 100, hold: 300 }
  - { at: 2300, turn: SELECT, clicks: 3 }
  - { at: 2900, note: C4, vel: 100, hold: 300 }
  - { at: 3200, note: D#4, vel: 100, hold: 300 }
  - { at: 3500, turn: SELECT, clicks: 3 }
  - { at: 4100, note: G3, vel: 100, hold: 300 }
  - { at: 4400, note: C4, vel: 100, hold: 300 }
  - { at: 4700, turn: ALGORITHM, clicks: 1 }
  - { at: 5000, note: C4, vel: 110, hold: 200 }
  - { at: 5250, note: C4, vel: 110, hold: 200 }
  - { at: 5500, turn: ALGORITHM, clicks: -1 }
  - { at: 5800, press: SCL }
  - { at: 6300, press: FX }
  - { at: 6800, press: ENV }
  - { at: 7300, press: LFO }
  - { at: 7800, press: EDIT }
  - { at: 8300, press: GLO }
  - { at: 8800, press: HOME }
  - { at: 9100, press: PLAY }
  - { at: 9500, note: C4, vel: 100, hold: 300 }
  - { at: 9800, turn: KNOB1, clicks: 10 }
  - { at: 10000, turn: KNOB2, clicks: 10 }
  - { at: 11300, note: G3, vel: 100, hold: 300 }
  - { at: 12300, screenshot: end }
expect:
  boots: true
