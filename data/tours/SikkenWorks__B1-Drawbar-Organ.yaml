# A held organ chord on the UPPER drawbar page, ENGINE MODE (HOME + FX) switched to SAWTOOTH (K1),
# then the six FX pages (FX, then SELECT: LESLIE, CHORUS, AMP, ROTOR, DELAY, REVERB) with a melody. Based on the README's "How to use it".
name: b1
ms: 12000
click_ms: 150
steps:
