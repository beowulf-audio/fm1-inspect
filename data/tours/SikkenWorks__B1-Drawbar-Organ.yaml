  - { at: 1700, note: C4, vel: 100, hold: 5200 }
  - { at: 1700, note: E4, vel: 100, hold: 5200 }
  - { at: 1700, note: G4, vel: 100, hold: 5200 }
  - { at: 4000, screenshot: drawbars }
  - { at: 4200, press: HOME, hold: 400 }
  - { at: 4250, press: FX, hold: 300 }
  - { at: 4900, turn: KNOB1, clicks: 2 }
  - { at: 5800, screenshot: saw }
  - { at: 6600, press: HOME }
  - { at: 7100, press: FX }
  - { at: 7300, note: A3, vel: 110, hold: 250 }
  - { at: 7600, note: C4, vel: 110, hold: 250 }
  - { at: 7900, note: E4, vel: 110, hold: 400 }
  - { at: 8300, turn: SELECT, clicks: 4 }
  - { at: 8600, note: F3, vel: 100, hold: 1200 }
  - { at: 8600, note: A3, vel: 100, hold: 1200 }
  - { at: 8600, note: C4, vel: 100, hold: 1200 }
  - { at: 9300, turn: SELECT, clicks: 1 }
  - { at: 10000, press: HOME }
  - { at: 10200, note: G3, vel: 100, hold: 1500 }
  - { at: 10200, note: B3, vel: 100, hold: 1500 }
  - { at: 10200, note: D4, vel: 100, hold: 1500 }
  - { at: 11800, screenshot: end }
expect:
  boots: true
