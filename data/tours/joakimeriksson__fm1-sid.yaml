# The tune player playing its first .sid tune, PRESETS on to the third, the FX page, then HOME to the SID synth:
# SAW LEAD played, PRESETS to another instrument and a bassline with the cutoff turned down (README "User guide").
name: fm1-sid-tour
ms: 12500
click_ms: 150
steps:
  - { at: 1500, screenshot: boot }
  - { at: 3600, screenshot: tune1 }
  - { at: 3700, turn: PRESETS, clicks: 2 }
  - { at: 6000, screenshot: tune3 }
  - { at: 6100, press: FX }
  - { at: 7100, press: FX }
  - { at: 7400, press: HOME }
  - { at: 7700, note: C4, vel: 100, hold: 250 }
  - { at: 8000, note: E4, vel: 100, hold: 250 }
  - { at: 8300, note: G4, vel: 100, hold: 250 }
  - { at: 8600, note: C5, vel: 100, hold: 500 }
  - { at: 9200, turn: PRESETS, clicks: 2 }
  - { at: 9600, note: G3, vel: 110, hold: 200 }
  - { at: 9900, note: G3, vel: 110, hold: 200 }
  - { at: 10200, note: A#3, vel: 110, hold: 200 }
  - { at: 10500, note: C4, vel: 110, hold: 400 }
  - { at: 11000, turn: KNOB1, clicks: -6 }
  - { at: 11000, note: G3, vel: 110, hold: 1200 }
  - { at: 12300, screenshot: synth }
expect:
  boots: true
