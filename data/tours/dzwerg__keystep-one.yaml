# keySTEP ONE: starts the four-track arranger on Home, live-records four notes into track 1 (REC on/off) and lets
# them loop, then opens LIVE PLAY (LFO) with its track mixer and returns Home (README: LIVE PLAY, LIVE PLAY mixer).
name: keystep
ms: 11500
click_ms: 150
steps:
  - { at: 1500, screenshot: boot }
  - { at: 1700, press: PLAY }
  - { at: 2000, press: REC }
  - { at: 2300, note: C4, vel: 100, hold: 150 }
  - { at: 2600, note: E4, vel: 100, hold: 150 }
  - { at: 2900, note: G4, vel: 100, hold: 150 }
  - { at: 3200, note: C5, vel: 100, hold: 150 }
  - { at: 3500, press: REC }
  - { at: 5000, screenshot: home }
  - { at: 5200, press: LFO }
  - { at: 6200, turn: KNOB1, clicks: -6 }
  - { at: 7400, screenshot: live }
  - { at: 7600, turn: KNOB1, clicks: 6 }
  - { at: 8600, press: HOME }
  - { at: 10800, screenshot: end }
expect:
  boots: true
