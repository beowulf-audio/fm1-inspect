# NACHTFAHRT: the piece plays itself; a lead phrase on the white keys, then the Drone (ENV), Sequence (ARP),
# Lead (LFO) and Space (FX) pages, back HOME and the Key page, then PRESETS to Phaedra with a phrase (README "In short").
name: nachtfahrt
ms: 12000
click_ms: 150
steps:
  - { at: 1500, screenshot: boot }
  - { at: 1700, note: D4, vel: 100, hold: 250 }
  - { at: 2000, note: F4, vel: 100, hold: 250 }
  - { at: 2300, note: A4, vel: 100, hold: 250 }
  - { at: 2600, note: G4, vel: 100, hold: 500 }
  - { at: 3300, press: ENV, hold: 200 }
  - { at: 4300, press: ARP, hold: 200 }
  - { at: 5300, press: LFO, hold: 200 }
  - { at: 6300, press: FX, hold: 200 }
  - { at: 7300, press: HOME, hold: 200 }
  - { at: 8000, press: HOME, hold: 200 }
  - { at: 8700, press: HOME, hold: 200 }
  - { at: 9000, turn: PRESETS, clicks: 2 }
  - { at: 9800, note: C4, vel: 100, hold: 250 }
  - { at: 10100, note: E4, vel: 100, hold: 250 }
  - { at: 10400, note: G4, vel: 100, hold: 400 }
  - { at: 11800, screenshot: end }
expect:
  boots: true
