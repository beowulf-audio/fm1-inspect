# FRASIL: a tapped key lights an A minor drone, PRESETS opens the drone preset grid and SEL keeps CATHEDRAL; SELECT
# moves to GLINT (FM bells over the drone) and BASS (one deep note), then FX opens GENERATIVE FX and K2 raises SPARKLE.
name: frasil-tour
ms: 12500
click_ms: 150
steps:
  - { at: 1500, screenshot: boot }
  - { at: 1700, note: A3, vel: 100, hold: 150 }
  - { at: 2800, turn: PRESETS, clicks: 2 }
  - { at: 3600, press: SCL }
  - { at: 4300, turn: SELECT, clicks: 1 }
  - { at: 4800, note: E5, vel: 100, hold: 150 }
  - { at: 5200, note: C5, vel: 100, hold: 150 }
  - { at: 5600, note: A4, vel: 100, hold: 150 }
  - { at: 6000, note: B4, vel: 100, hold: 150 }
  - { at: 6600, turn: SELECT, clicks: 1 }
  - { at: 7000, note: A3, vel: 110, hold: 150 }
  - { at: 7800, press: FX }
  - { at: 8200, turn: KNOB2, clicks: 12 }
  - { at: 10300, press: HOME }
  - { at: 12400, screenshot: end }
expect:
  boots: true
