# The pet game from the README's quick start: Feed, Praise and Clean on the first black keys, a pentatonic line on
# the white keys (bongos join), the key guide (HOME), the Start Over prompt (GLO, left on No), then Rest.
name: trumpagotchi-tour
ms: 12500
click_ms: 150
steps:
  - { at: 1400, screenshot: boot }
  - { at: 1700, note: F#3, hold: 150 }
  - { at: 3000, note: G#3, hold: 150 }
  - { at: 4300, note: A#3, hold: 150 }
  - { at: 5600, note: F3, hold: 200 }
  - { at: 5850, note: G3, hold: 200 }
  - { at: 6100, note: A3, hold: 200 }
  - { at: 6350, note: C4, hold: 200 }
  - { at: 6600, note: D4, hold: 300 }
  - { at: 7000, note: C4, hold: 200 }
  - { at: 7250, note: A3, hold: 400 }
  - { at: 7900, press: HOME }
  - { at: 9000, press: HOME }
  - { at: 9300, press: GLO }
  - { at: 10400, press: GLO }
  - { at: 10700, note: C#4, hold: 150 }
  - { at: 12300, screenshot: end }
expect:
  boots: true
