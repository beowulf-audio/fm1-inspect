# SLOOP: select the drum track, record a one-bar free take (REC, play, REC on the next "1"), the loop plays;
# then a kit change, a stutter punch-in effect from the FX layer, and the HOME visualiser (README "Your first beat in 60 seconds").
name: sloop-tour
ms: 10500
click_ms: 150
steps:
  - { at: 1400, screenshot: boot }
  - { at: 1600, turn: ALGORITHM, clicks: 3 }
  - { at: 2200, press: REC }
  # one bar at 120 BPM: kick, hats, snare
  - { at: 2500, note: F3, hold: 120 }
  - { at: 2500, note: C4, hold: 80 }
  - { at: 2750, note: C4, hold: 80 }
  - { at: 3000, note: A3, hold: 120 }
  - { at: 3000, note: C4, hold: 80 }
  - { at: 3250, note: C4, hold: 80 }
  - { at: 3375, note: F3, hold: 120 }
  - { at: 3500, note: F3, hold: 120 }
  - { at: 3500, note: C4, hold: 80 }
  - { at: 3750, note: D4, hold: 80 }
  - { at: 4000, note: A3, hold: 120 }
  - { at: 4000, note: C4, hold: 80 }
  - { at: 4250, note: C4, hold: 80 }
  - { at: 4500, press: REC }
  - { at: 5800, screenshot: looping }
  - { at: 6000, turn: PRESETS, clicks: 1 }
  # punch-in effect: hold FX, press a key
  - { at: 7000, press: FX, hold: 1400 }
  - { at: 7300, note: C4, hold: 900 }
  - { at: 8000, screenshot: fx }
  - { at: 8800, press: HOME }
  - { at: 10300, screenshot: visualiser }
expect:
  boots: true
