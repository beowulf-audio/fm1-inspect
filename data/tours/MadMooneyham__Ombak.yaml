# Starts the gamelan cycle (SEQ), leads a few core notes on the white keys, speeds the tempo (ALGO) and raises DENSITY (K2),
# then visits the SHAPE (ENV), GAMELAN (EDIT) and FX pages and returns HOME (MANUAL sections 1-4, 12).
name: ombak-tour
ms: 12000
click_ms: 150
steps:
  - { at: 1500, screenshot: boot }
  - { at: 1700, note: C4, vel: 100, hold: 400 }
  - { at: 2200, press: SEQ }
  - { at: 2350, turn: ALGORITHM, clicks: 8 }
  - { at: 3300, note: E4, vel: 100, hold: 200 }
  - { at: 3600, turn: KNOB2, clicks: 12 }
  - { at: 5400, note: G4, vel: 100, hold: 200 }
  - { at: 5500, screenshot: home-playing }
  - { at: 6200, press: ENV }
  - { at: 7200, screenshot: shape }
  - { at: 7400, press: EDIT }
  - { at: 8400, screenshot: gamelan }
  - { at: 8600, press: FX }
  - { at: 9500, screenshot: fx }
  - { at: 9700, press: HOME }
  - { at: 10000, note: D4, vel: 100, hold: 200 }
  - { at: 11800, screenshot: home }
expect:
  boots: true
