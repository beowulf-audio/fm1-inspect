# Plays the factory pattern A01 (PLAY), then steps through the track pages (SYN, AMP, FILT, FX, LFO, GLO TIME)
# and back to HOME, where PRESETS queues pattern A02.
name: mono2k-tour
ms: 12000
click_ms: 150
steps:
  - { at: 1400, screenshot: boot }
  - { at: 1700, note: C4, hold: 250 }
  - { at: 2000, note: E4, hold: 250 }
  - { at: 2300, note: G4, hold: 250 }
  - { at: 2700, press: PLAY }
  - { at: 3400, press: EDIT }
  - { at: 3700, note: C4, hold: 250 }
  - { at: 4300, press: ENV }
  - { at: 5200, press: SCL }
  - { at: 6100, press: FX }
  - { at: 7000, press: LFO }
  - { at: 7900, press: GLO }
  - { at: 8800, press: HOME }
  - { at: 9300, turn: PRESETS, clicks: 1 }
  - { at: 11800, screenshot: end }
expect:
  boots: true
