# GR!MM: after the boot screen, load the recorded CATHEDRAL CHOIR on T1 and IRON BELL on T2, then hold FX for
# GENERATE (MANUAL 10): T1 on in DRIFT, T2 set to PULSE and on; both play by themselves on HOME, then a REV THROW.
name: grimm-tour
ms: 15500
click_ms: 150
steps:
  - { at: 1400, screenshot: boot }
  - { at: 5300, pot: 950 }
  - { at: 5400, turn: PRESETS, clicks: -7 }
  - { at: 6700, note: C4, hold: 600 }
  - { at: 6700, note: G4, hold: 600 }
  - { at: 7600, turn: ALGORITHM, clicks: 1 }
  - { at: 7800, turn: PRESETS, clicks: 13 }
  - { at: 10100, note: G4, hold: 300 }
  # hold FX: GENERATE
  - { at: 10500, press: FX, hold: 2000 }
  - { at: 10800, note: F#3, hold: 150 }
  - { at: 11100, note: G#3, hold: 500 }
  - { at: 11300, note: D#4, hold: 150 }
  - { at: 11800, note: G#3, hold: 150 }
  - { at: 13300, screenshot: home }
  # a reverb throw
  - { at: 13600, press: FX, hold: 1200 }
  - { at: 13900, note: G3, hold: 700 }
  - { at: 15300, screenshot: end }
expect:
  boots: true
