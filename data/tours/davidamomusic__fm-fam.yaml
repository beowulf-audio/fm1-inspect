# Programs steps on the white keys, starts the 16-step sequencer with PLAY, then visits the synth (EDIT), patch bay
# (LFO), kick (ARP), effects (FX) and patterns (GLO) modes and steps synth presets while it plays (cheat sheet).
name: fm-fam-tour
ms: 12000
click_ms: 150
steps:
  - { at: 1500, screenshot: boot }
  - { at: 1700, note: F3, hold: 80 }
  - { at: 1850, note: A3, hold: 80 }
  - { at: 2000, note: C4, hold: 80 }
  - { at: 2150, note: E4, hold: 80 }
  - { at: 2300, note: F4, hold: 80 }
  - { at: 2450, note: A4, hold: 80 }
  - { at: 2600, note: B4, hold: 80 }
  - { at: 2750, note: D5, hold: 80 }
  - { at: 2900, note: F5, hold: 80 }
  - { at: 3200, press: PLAY }
  - { at: 4200, press: EDIT }
  - { at: 5000, turn: PRESETS, clicks: 1 }
  - { at: 6000, turn: PRESETS, clicks: 1 }
  - { at: 7000, press: LFO }
  - { at: 7800, press: ARP }
  - { at: 8600, press: FX }
  - { at: 9400, press: GLO }
  - { at: 10200, press: SEQ }
  - { at: 11000, turn: KNOB1, clicks: 4 }
  - { at: 11800, screenshot: end }
expect:
  boots: true
