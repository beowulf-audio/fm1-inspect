  - { at: 8400, note: G#3, hold: 150 }
  - { at: 8700, note: C4, hold: 150 }
  - { at: 9000, note: D5, hold: 150 }
  - { at: 9400, note: A#3, hold: 150 }
  - { at: 9700, note: A3, hold: 150 }
  - { at: 10000, note: E4, hold: 150 }
  - { at: 10300, note: B4, hold: 150 }
  - { at: 10600, note: F5, hold: 150 }
  - { at: 11800, screenshot: playing }
expect:
  boots: true
