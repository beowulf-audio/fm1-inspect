# PLAY sings the loaded song with its lyrics on Sing, FX enters the karaoke room and two white keys punch in effects;
# then GLO, SELECT, SEL switch to SLAMJAM and FX starts the poem in the SLAMJAM room, with the wah and the air horn
# (docs/MANUAL.md: "Karaoke (FX)", "Setup (GLO)", "SLAMJAM").
name: 386dx
ms: 12000
click_ms: 150
steps:
  - { at: 1500, screenshot: boot }
  - { at: 1600, press: PLAY }
  - { at: 3600, press: FX }
  - { at: 4300, note: C4, hold: 500 }
  - { at: 5000, note: G4, hold: 500 }
  - { at: 5700, press: PLAY }
  - { at: 6000, press: GLO }
  - { at: 6400, turn: SELECT, clicks: 1 }
  - { at: 6900, press: SCL }
  - { at: 7400, press: FX }
  - { at: 9000, note: F3, hold: 800 }
  - { at: 10300, note: B3, hold: 600 }
  - { at: 11800, screenshot: end }
expect:
  boots: true
