# PLAY starts the power-on DUNGEON scene; HOME taps walk MIXER, CLOCK, KEYS, DREAM and SCENES, where A3 switches the music
# live to TAVERN and B3 to CHAPEL; HOME goes back (README: "What's new" 2.4 SCENES, 2.3 DREAM, 2.1 KEYS).
name: ghoulbox
ms: 12000
click_ms: 150
steps:
  - { at: 1500, screenshot: boot }
  - { at: 1600, press: PLAY }
  - { at: 2800, press: HOME }
  - { at: 3500, press: HOME }
  - { at: 4200, press: HOME }
  - { at: 4900, press: HOME }
  - { at: 5600, press: HOME }
  - { at: 6300, note: A3, hold: 200 }
  - { at: 8800, note: B3, hold: 200 }
  - { at: 11000, press: HOME }
  - { at: 11800, screenshot: end }
expect:
  boots: true
