# A MIDI-only sequencer (silent by design): the Steps page and a step's detail, PLAY, then on T2 a Euclid pattern
# generated and printed (ARP), its steps playing, the Overview (LFO), Perform (FX) and Global (GLO) pages.
name: relay16-tour
ms: 12000
click_ms: 150
steps:
  - { at: 1500, screenshot: boot }
  - { at: 1700, press: SEQ }
  - { at: 2100, note: F3, hold: 120 }
  - { at: 2300, note: B3, hold: 120 }
  - { at: 2500, note: F4, hold: 120 }
  - { at: 2700, note: B4, hold: 120 }
  - { at: 2900, note: G#3, hold: 120 }
  - { at: 3100, note: A3, hold: 120 }
  - { at: 3300, note: D4, hold: 120 }
  - { at: 3500, note: A4, hold: 120 }
  - { at: 3700, note: D5, hold: 120 }
  - { at: 4000, press: PLAY }
  - { at: 4800, screenshot: steps }
  - { at: 5000, turn: ALGORITHM, clicks: 1 }
  - { at: 5400, press: ARP }
  - { at: 5800, turn: KNOB2, clicks: 5 }
  - { at: 6800, screenshot: gen }
  - { at: 7000, press: ARP }
  - { at: 7400, press: SEQ }
  - { at: 8400, screenshot: steps2 }
  - { at: 8600, press: LFO }
  - { at: 9800, screenshot: overview }
  - { at: 10000, press: FX }
  - { at: 10800, press: GLO }
  - { at: 11800, screenshot: global }
expect:
  boots: true
