# CoralFlower: chord buttons on the upper row (M, m, M7) turn root keys into chords with bass while the flower grows,
# then the arpeggiator switched on (ARPEGGIO page) over a held chord, and a new chord sound from PRESETS.
name: coralflower-tour
ms: 11500
click_ms: 150
steps:
  - { at: 1500, screenshot: boot }
  - { at: 1600, note: C#5, hold: 150 }
  - { at: 1900, note: C4, vel: 100, hold: 600 }
  - { at: 2600, note: D#5, hold: 150 }
  - { at: 2800, note: A3, vel: 100, hold: 600 }
  - { at: 3500, note: C#5, hold: 150 }
  - { at: 3700, note: F4, vel: 100, hold: 600 }
  - { at: 4400, note: G#3, hold: 150 }
  - { at: 4600, note: G3, vel: 100, hold: 700 }
  - { at: 5500, press: ARP }
  - { at: 5800, turn: KNOB1, clicks: 1 }
  - { at: 6100, note: C4, vel: 100, hold: 2000 }
  - { at: 8000, screenshot: arp }
  - { at: 8300, turn: KNOB1, clicks: -1 }
  - { at: 8500, press: HOME }
  - { at: 8800, turn: PRESETS, clicks: 2 }
  - { at: 9500, note: A3, vel: 100, hold: 900 }
  - { at: 10500, note: F4, vel: 100, hold: 800 }
  - { at: 11400, screenshot: end }
expect:
  boots: true
