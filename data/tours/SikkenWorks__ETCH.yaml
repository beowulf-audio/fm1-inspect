# ETCH: skips the intro to the SIMPLE/ADVANCED mode screen, then plays notes across the SIMPLE pages MORPH (waves A/B),
# FILTER and FX (live waveform), and ends on the DRAW wave editor (README: Getting started).
name: etch
ms: 12500
click_ms: 150
steps:
  - { at: 1500, press: HOME }
  - { at: 2000, press: SCL }
  - { at: 2600, note: C4, vel: 120, hold: 1100 }
  - { at: 2600, note: G4, vel: 120, hold: 1100 }
  - { at: 3900, turn: SELECT, clicks: 1 }
  - { at: 4200, note: C4, vel: 120, hold: 1500 }
  - { at: 4200, note: E4, vel: 120, hold: 1500 }
  - { at: 4400, turn: KNOB3, clicks: 10 }
  - { at: 6000, turn: SELECT, clicks: 1 }
  - { at: 6300, note: E4, vel: 120, hold: 1000 }
  - { at: 7500, turn: SELECT, clicks: 1 }
  - { at: 7800, note: G4, vel: 120, hold: 1000 }
  - { at: 9000, press: EDIT }
  - { at: 9300, turn: KNOB2, clicks: 12 }
  - { at: 10000, turn: KNOB1, clicks: 8 }
  - { at: 10000, turn: KNOB2, clicks: -12 }
  - { at: 11200, note: C4, vel: 120, hold: 1100 }
  - { at: 12300, screenshot: end }
expect:
  boots: true
