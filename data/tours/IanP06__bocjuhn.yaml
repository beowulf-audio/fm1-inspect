# bocjuhn: records a free loop on track 1 (FM), then picks tracks 2-4 with the top-row buttons and turns PRESETS
# to other engines (FRACT, HIVE, RYUJI), each with its animated drawing, back to track 1 with its loop playing
# (README-TONITOR.md "Playing it").
name: bocjuhn-tour
ms: 12000
click_ms: 150
steps:
