# Flyfish: PLAY starts the étude on the sampled grand and HOME's waterfall; ARP opens VARIATIONS (the bars as a roll)
# and K2 moves it to MINOR, PRESETS changes the sound while it plays, FX shows the PIANO page (README: The controls).
name: flyfish-tour
ms: 12000
click_ms: 150
steps:
  - { at: 1500, screenshot: boot }
  - { at: 1600, press: PLAY }
  - { at: 4400, press: HOME }
  - { at: 5800, press: ARP }
  - { at: 6200, turn: KNOB2, clicks: 1 }
  - { at: 7800, turn: PRESETS, clicks: 3 }
  - { at: 9300, press: FX }
  - { at: 10600, press: HOME }
  - { at: 11900, screenshot: end }
expect:
  boots: true
