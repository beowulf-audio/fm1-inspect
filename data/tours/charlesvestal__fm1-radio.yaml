# No network in the preview, so: the WiFi network list at start, the Radio home page, the controls card (HOME held),
# then the 4-voice synth (ARP) with chords while K1 changes the wave and K4/K2 the release and filter.
name: radio-tour
ms: 12000
click_ms: 150
steps:
  - { at: 1400, screenshot: boot }
  - { at: 1700, press: HOME }
  - { at: 2500, press: HOME, hold: 1500 }
  - { at: 4400, press: ARP }
  - { at: 4700, turn: KNOB4, clicks: 12 }
  - { at: 6600, note: C4, hold: 700 }
  - { at: 6600, note: E4, hold: 700 }
  - { at: 6600, note: G4, hold: 700 }
  - { at: 7500, turn: KNOB1, clicks: 12 }
  - { at: 7600, note: A4, hold: 400 }
  - { at: 8100, note: C5, hold: 400 }
  - { at: 8600, note: E5, hold: 400 }
  - { at: 9300, turn: KNOB2, clicks: -10 }
  - { at: 9400, note: F4, hold: 1200 }
  - { at: 9400, note: A4, hold: 1200 }
  - { at: 9400, note: C5, hold: 1200 }
  - { at: 11000, press: GLO }
  - { at: 11800, screenshot: end }
expect:
  boots: true
