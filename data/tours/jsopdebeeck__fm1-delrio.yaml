# The hand-percussion kit playing a rhythm (PLAY), the steps of two more instruments (SELECT), the next rhythm
# (PRESETS), then the tanpura, shruti and berimbau pages (README "What it does").
name: delrio
ms: 12000
click_ms: 150
steps:
  - { at: 1500, screenshot: boot }
  - { at: 1600, press: HOME }
  - { at: 2000, press: PLAY }
  - { at: 3400, turn: SELECT, clicks: 1 }
  - { at: 4400, turn: SELECT, clicks: 1 }
  - { at: 5300, turn: PRESETS, clicks: 1 }
  - { at: 7000, press: FX }
  - { at: 8000, press: FX }
  - { at: 8800, press: FX }
  - { at: 9400, note: F#3, vel: 110, hold: 200 }
  - { at: 9800, note: G#3, vel: 110, hold: 200 }
  - { at: 10200, note: F#3, vel: 110, hold: 200 }
  - { at: 10600, note: A#3, vel: 110, hold: 200 }
  - { at: 11000, note: F#3, vel: 110, hold: 200 }
  - { at: 11300, note: G#3, vel: 110, hold: 200 }
  - { at: 11800, screenshot: berimbau }
expect:
  boots: true
