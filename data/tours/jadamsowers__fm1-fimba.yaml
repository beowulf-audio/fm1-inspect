  - { at: 1950, note: A4, hold: 200 }
  - { at: 2200, note: B4, hold: 200 }
  - { at: 2450, note: C4, hold: 250 }
  - { at: 2750, note: B3, hold: 250 }
  - { at: 3050, note: D5, hold: 200 }
  - { at: 3300, note: C5, hold: 200 }
  - { at: 3550, note: B4, hold: 300 }
  - { at: 3900, screenshot: tines }
  - { at: 4000, note: F#3, hold: 500 }
  - { at: 4600, note: F#4, hold: 500 }
  - { at: 5200, note: C#4, hold: 500 }
  - { at: 5800, note: D#4, hold: 500 }
  - { at: 6100, screenshot: chords }
