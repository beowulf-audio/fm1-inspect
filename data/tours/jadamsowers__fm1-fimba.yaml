# A tine melody (white keys, lowest tine in the middle), black-key chord rolls, then ARP starts the mbira
# pattern while SELECT changes the material and the Body, Space and Grain pages open (README, "The controls").
name: fimba-tour
ms: 12000
click_ms: 150
steps:
  - { at: 1500, screenshot: boot }
