# Plays pattern 1 (a microsound groove) on the HOME page, holds FX + white keys for repeat and tape-stop effects,
# rolls a new random beat with ARP, then the slot SOUND and RHYTHM pages (EDIT) and the FX filter page (GLITCH.md "Playing").
name: glitch-tour
ms: 12000
click_ms: 150
steps:
  - { at: 1500, screenshot: boot }
  - { at: 1700, press: PLAY }
  - { at: 2000, press: HOME }
  - { at: 3000, screenshot: playing }
  - { at: 3200, press: FX, hold: 2300 }
  - { at: 3400, note: B3, hold: 800 }
  - { at: 4400, note: D5, hold: 900 }
  - { at: 5700, press: ARP }
  - { at: 7400, screenshot: random }
  - { at: 7600, press: EDIT }
  - { at: 8600, press: EDIT }
  - { at: 9600, screenshot: rhythm }
  - { at: 9800, press: FX }
  - { at: 11700, screenshot: filter }
expect:
  boots: true
