# Lets the generative piece play and steers it without touching the scale: the Arrangement meters (SEL), the Dub,
# Chord and Drums pages (FX, ENV, SEQ), a DJ-filter sweep (SELECT) on HOME, then the next piece (PRESETS).
name: dub-tour
ms: 12000
click_ms: 150
steps:
  - { at: 1400, screenshot: boot }
  - { at: 2200, press: SCL }
  - { at: 3300, press: FX }
  - { at: 4300, press: ENV }
  - { at: 5300, press: SEQ }
  - { at: 5700, press: SEQ }
  - { at: 6100, press: SEQ }
  - { at: 7100, press: HOME }
  - { at: 7400, turn: SELECT, clicks: -6 }
  - { at: 8800, turn: SELECT, clicks: 6 }
  - { at: 9800, turn: PRESETS, clicks: 1 }
  - { at: 11800, screenshot: end }
expect:
  boots: true
