# Bytemania (bytebeat synth): classic bytebeat patches (FIRST, MU6K LEAD, MODEM, FRACTAL, RYG TRI) held while
# KNOB1/KNOB2 change the formula's variables, its raster view changing as it plays (README "Playing").
name: bytemania
ms: 12000
click_ms: 150
steps:
  - { at: 1500, screenshot: boot }
  - { at: 1700, note: C4, vel: 100, hold: 300 }
  - { at: 2100, note: G4, vel: 100, hold: 300 }
  - { at: 2600, turn: PRESETS, clicks: 9 }
  - { at: 4100, note: C4, vel: 100, hold: 2300 }
  - { at: 4600, turn: KNOB1, clicks: 8 }
  - { at: 5600, turn: KNOB2, clicks: 6 }
  - { at: 6600, turn: PRESETS, clicks: 3 }
  - { at: 7200, note: C4, vel: 100, hold: 1700 }
  - { at: 7700, press: FX }
  - { at: 9100, turn: PRESETS, clicks: 2 }
  - { at: 9500, note: G4, vel: 100, hold: 2200 }
  - { at: 10100, press: SEQ }
  - { at: 11000, press: FX }
  - { at: 11800, screenshot: end }
expect:
  boots: true
