# Plays the four-part pattern at power-on, opens the PRESETS list, steps SELECT through the parts (pad, bell, drum grid),
# then the FX sends (FX) and the GLOBAL MIXER (GLO), still playing. Based on the site's control guide.
name: mc-1
ms: 12000
click_ms: 150
steps:
  - { at: 1500, screenshot: boot }
  - { at: 1700, press: PLAY }
  - { at: 3200, turn: PRESETS, clicks: 2 }
  - { at: 4600, screenshot: preset }
  - { at: 5000, turn: SELECT, clicks: 1 }
  - { at: 5900, turn: SELECT, clicks: 1 }
  - { at: 6800, turn: SELECT, clicks: 1 }
  - { at: 7700, screenshot: part4 }
  - { at: 7800, press: FX }
  - { at: 8300, press: ENV }
  - { at: 9300, screenshot: fx }
  - { at: 9400, press: GLO }
  - { at: 10500, screenshot: mixer }
  - { at: 10700, press: HOME }
  - { at: 11800, screenshot: home }
expect:
  boots: true
