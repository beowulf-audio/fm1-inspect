# CTL-1: plays a chord on the Play page (GM piano), turns a CC knob, opens Keys, starts the four-track Euclidean drum
# Sequencer and steps to track 2, holds notes on the Arp page, arpeggiates it, then opens the Sound page (README: In short).
name: ctl
ms: 12000
click_ms: 150
steps:
  - { at: 1500, screenshot: boot }
  - { at: 1700, note: C4, vel: 100, hold: 600 }
  - { at: 1700, note: E4, vel: 100, hold: 600 }
  - { at: 1700, note: G4, vel: 100, hold: 600 }
  - { at: 2400, turn: KNOB1, clicks: 4 }
  - { at: 3200, press: SCL }
  - { at: 3600, note: D4, vel: 100, hold: 200 }
  - { at: 3900, note: F4, vel: 100, hold: 200 }
  - { at: 4400, press: SEQ }
  - { at: 4800, press: PLAY }
  - { at: 6000, turn: SELECT, clicks: 1 }
  - { at: 6800, screenshot: seq }
  - { at: 7000, press: ARP }
  - { at: 7300, turn: KNOB1, clicks: 1 }
  - { at: 7500, note: C4, vel: 100, hold: 1200 }
  - { at: 7500, note: G4, vel: 100, hold: 1200 }
  - { at: 8900, turn: KNOB1, clicks: -1 }
  - { at: 9050, press: EDIT }
  - { at: 9300, turn: PRESETS, clicks: 3 }
  - { at: 9900, note: C4, vel: 100, hold: 400 }
  - { at: 10500, press: PLAY }
  - { at: 10700, press: HOME }
  - { at: 11500, screenshot: home }
expect:
  boots: true
