# HAWK CHUA: opens ARP and starts it with PLAY on a held chord, brings in the KARMA phrase sequencer (SEQ joins the ARP),
# then stops and steps the FX page through its models (TUNED BAR, SYMP STRING) with notes (README: ARP and SEQ, together).
name: hawk
ms: 12000
click_ms: 150
steps:
  - { at: 1500, screenshot: boot }
  - { at: 1700, press: ARP }
  - { at: 2000, press: PLAY }
  - { at: 2200, note: C4, vel: 100, hold: 4000 }
  - { at: 2200, note: E4, vel: 100, hold: 4000 }
  - { at: 2200, note: G4, vel: 100, hold: 4000 }
  - { at: 4000, press: SEQ }
  - { at: 6100, screenshot: arpseq }
  - { at: 6400, press: PLAY }
  - { at: 6700, press: FX }
  - { at: 7000, note: C4, vel: 100, hold: 900 }
  - { at: 8200, turn: PRESETS, clicks: 2 }
  - { at: 8600, note: C4, vel: 100, hold: 1000 }
  - { at: 8600, note: G4, vel: 100, hold: 1000 }
  - { at: 10000, turn: PRESETS, clicks: 3 }
  - { at: 10400, note: E4, vel: 100, hold: 1000 }
  - { at: 11800, screenshot: end }
expect:
  boots: true
