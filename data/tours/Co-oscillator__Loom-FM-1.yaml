# ALGORITHM to the drum track D, SEQ held + C4 (SEQ TOOLS > RANDOM) rolls a random beat, PLAY; SEQ steps through 4x4 STEP,
# 4x4 PAT and 8x8 STEP; then track 1's ACID sound is played over the beat on HOME, and HOME again shows the mixer
# (README: "Controls", "Features" > SEQ TOOLS).
name: loom
ms: 12000
click_ms: 150
steps:
  - { at: 1500, screenshot: boot }
  - { at: 1600, turn: ALGORITHM, clicks: 5 }
  - { at: 2400, press: SEQ, hold: 1100 }
  - { at: 2800, note: C4, hold: 200 }
  - { at: 3800, press: PLAY }
  - { at: 4300, press: SEQ }
  - { at: 5300, press: SEQ }
  - { at: 6300, press: SEQ }
  - { at: 7300, press: HOME }
  - { at: 7600, turn: ALGORITHM, clicks: -5 }
  - { at: 8400, note: F3, vel: 110, hold: 200 }
  - { at: 8700, note: F3, vel: 90, hold: 200 }
  - { at: 9000, note: C4, vel: 110, hold: 200 }
  - { at: 9300, note: G#3, vel: 100, hold: 300 }
  - { at: 9800, note: F3, vel: 110, hold: 200 }
  - { at: 10100, note: D#4, vel: 120, hold: 300 }
  - { at: 10600, press: HOME }
  - { at: 11800, screenshot: end }
expect:
  boots: true
