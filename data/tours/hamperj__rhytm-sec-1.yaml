# RHYTM-SEC-1 (generative drums and bass): PLAY, a fill (FX), two style changes on SELECT, the DJ filter on
# ALGORITHM, a breakdown and build (SAVE), and the DRUMS and GEN knob pages via SEL (README "Controls").
name: rhytm
ms: 12500
click_ms: 150
steps:
  - { at: 1500, screenshot: boot }
  - { at: 1700, press: PLAY }
  - { at: 3200, press: FX }
  - { at: 4300, turn: SELECT, clicks: 1 }
  - { at: 6000, turn: SELECT, clicks: 2 }
  - { at: 7400, turn: ALGORITHM, clicks: -6 }
  - { at: 8400, turn: ALGORITHM, clicks: 6 }
  - { at: 8800, press: SAVE }
  - { at: 9300, press: SCL }
  - { at: 10200, press: SCL }
  - { at: 10700, press: SAVE }
  - { at: 11400, press: SAVE }
  - { at: 12300, screenshot: end }
expect:
  boots: true
