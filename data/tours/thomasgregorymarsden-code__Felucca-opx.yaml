# OPX: EDIT held + A3 puts the track on the OPX engine; EDIT then steps its ALGO, OPERATORS and ENVELOPE pages
# with notes on each; back on HOME, KNOB 4 (SLOT) steps on through the factory patches, a phrase each (README "The OPX engine").
name: opx-tour
ms: 14000
click_ms: 150
steps:
  - { at: 3700, screenshot: boot }
  - { at: 3900, press: EDIT, hold: 700 }
  - { at: 4200, note: A3, hold: 200 }
  - { at: 5000, note: C4, vel: 110, hold: 300 }
  - { at: 5000, note: E4, vel: 110, hold: 300 }
  - { at: 5000, note: G4, vel: 110, hold: 300 }
  - { at: 5600, press: EDIT }
  - { at: 5900, note: C5, vel: 110, hold: 500 }
  - { at: 6700, press: EDIT }
  - { at: 7000, note: G4, vel: 110, hold: 500 }
  - { at: 7800, press: EDIT }
  - { at: 8100, note: E4, vel: 110, hold: 500 }
  - { at: 8700, press: HOME }
  - { at: 8900, turn: KNOB4, clicks: 1 }
  - { at: 9300, note: C4, vel: 110, hold: 250 }
  - { at: 9600, note: G4, vel: 110, hold: 250 }
  - { at: 9900, note: C5, vel: 110, hold: 500 }
  - { at: 10800, turn: KNOB4, clicks: 1 }
  - { at: 11200, note: F3, vel: 110, hold: 200 }
  - { at: 11500, note: F3, vel: 110, hold: 200 }
  - { at: 11800, note: G#3, vel: 110, hold: 200 }
  - { at: 12100, note: C4, vel: 110, hold: 500 }
  - { at: 13800, screenshot: end }
expect:
  boots: true
