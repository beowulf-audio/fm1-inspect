# Writes a short pattern in the EDITOR (HOME + OP2, REC, keys), plays it in a loop, and while it plays shows VISUAL
# (HOME + PIT) and INSTRUMENTS (HOME + OP3) with a preset change (manual "First steps": "Write a pattern").
name: ptfm-tour
ms: 12500
click_ms: 150
steps:
  - { at: 1500, screenshot: boot }
  - { at: 1700, press: HOME, hold: 400 }
  - { at: 1850, note: n3, hold: 150 }
  - { at: 2400, press: REC }
  - { at: 2700, note: C4, hold: 120 }
  - { at: 2900, note: E4, hold: 120 }
  - { at: 3100, note: G4, hold: 120 }
  - { at: 3300, note: C5, hold: 120 }
  - { at: 3500, note: B4, hold: 120 }
  - { at: 3700, note: G4, hold: 120 }
  - { at: 3900, note: A4, hold: 120 }
  - { at: 4100, note: E4, hold: 120 }
  - { at: 4400, press: REC }
  - { at: 4600, turn: SELECT, clicks: -8 }
  - { at: 6000, press: PLAY }
  - { at: 7500, press: HOME, hold: 400 }
  - { at: 7650, note: n15, hold: 150 }
  - { at: 9300, press: HOME, hold: 400 }
  - { at: 9450, note: n5, hold: 150 }
  - { at: 10200, turn: PRESETS, clicks: 3 }
  - { at: 11000, turn: PRESETS, clicks: 3 }
  - { at: 12300, screenshot: end }
expect:
  boots: true
