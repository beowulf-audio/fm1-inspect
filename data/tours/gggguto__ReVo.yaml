# ReVo (Bioma island): PLAY wakes the inhabitants, Density up, Wind chords on the keys (field guide "Wake the island",
# "Wind"), then the Birds and Insects pages (EDIT, ALGO), Ocean Tide (LFO), Resonance (ENV), Drift (SEQ), Glitch (FX),
# and back HOME for a Wind preset change.
name: revo
ms: 12500
click_ms: 150
steps:
  - { at: 1500, screenshot: boot }
  - { at: 1700, press: PLAY }
  - { at: 2000, turn: KNOB4, clicks: 8 }
  - { at: 3300, note: C4, vel: 100, hold: 1200 }
  - { at: 3300, note: G4, vel: 100, hold: 1200 }
  - { at: 3300, note: E5, vel: 100, hold: 1200 }
  - { at: 4700, press: EDIT }
  - { at: 5400, turn: ALGORITHM, clicks: 1 }
  - { at: 6200, press: LFO }
  - { at: 7000, press: ENV }
  - { at: 7800, press: SEQ }
  - { at: 8600, press: FX }
  - { at: 9400, press: HOME }
  - { at: 9700, turn: PRESETS, clicks: 1 }
  - { at: 10200, note: A3, vel: 100, hold: 1500 }
  - { at: 10200, note: E4, vel: 100, hold: 1500 }
  - { at: 10200, note: C5, vel: 100, hold: 1500 }
  - { at: 12400, screenshot: end }
expect:
  boots: true
