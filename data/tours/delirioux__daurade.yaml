# Starts the groove (PLAY), changes style to NIGHT DRIVE on the next bar (PRESETS), a DROP (REC held) and a SOLO (SEQ), a lead on
# the keys, then the SOUND, GROOVE and MIX pages (FX, ARP, GLO) and back to PLAY (HOME). Based on the README's controls.
name: daurade
ms: 12000
click_ms: 150
steps:
  - { at: 1500, screenshot: boot }
  - { at: 1700, press: PLAY }
  - { at: 3400, turn: PRESETS, clicks: 3 }
  - { at: 5000, screenshot: style }
  - { at: 5200, press: REC, hold: 1500 }
  - { at: 6900, press: SEQ }
  - { at: 7300, note: C4, vel: 110, hold: 200 }
  - { at: 7550, note: D#4, vel: 110, hold: 200 }
  - { at: 7800, note: G4, vel: 110, hold: 400 }
  - { at: 8400, press: FX }
  - { at: 9200, press: ARP }
  - { at: 10000, press: GLO }
  - { at: 10800, press: HOME }
  - { at: 11800, screenshot: end }
expect:
  boots: true
