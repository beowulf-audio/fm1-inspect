# Starts the BEAT and plays pentatonic notes with the Cat, changes PET (SELECT) and WORLD (ALGORITHM: sea, balloons,
# space), switches to DRUMS (FX) and raises BUSY, then plays a nursery TUNE (LFO); per the docs' control table.
name: purplemonkey-tour
ms: 12000
click_ms: 150
steps:
  - { at: 1500, screenshot: boot }
  - { at: 1700, press: PLAY }
  - { at: 2200, note: C4, vel: 100, hold: 250 }
  - { at: 2500, note: E4, vel: 100, hold: 250 }
  - { at: 2800, note: G4, vel: 100, hold: 250 }
  - { at: 3100, note: C5, vel: 110, hold: 400 }
  - { at: 3700, turn: SELECT, clicks: 1 }
  - { at: 4200, note: D4, vel: 100, hold: 250 }
  - { at: 4500, note: A4, vel: 100, hold: 400 }
  - { at: 5000, turn: ALGORITHM, clicks: 1 }
  - { at: 5600, turn: ALGORITHM, clicks: 2 }
  - { at: 6200, screenshot: world }
  - { at: 6300, press: FX }
  - { at: 6600, note: F3, vel: 110, hold: 150 }
  - { at: 6900, note: A3, vel: 110, hold: 150 }
  - { at: 7200, note: G3, vel: 110, hold: 150 }
  - { at: 7500, turn: KNOB2, clicks: 4 }
  - { at: 8300, screenshot: drums }
  - { at: 8400, turn: SELECT, clicks: 1 }
  - { at: 8900, press: LFO }
  - { at: 9200, note: C4, vel: 100, hold: 250 }
  - { at: 9550, note: D4, vel: 100, hold: 250 }
  - { at: 9900, note: E4, vel: 100, hold: 250 }
  - { at: 10250, note: F4, vel: 100, hold: 250 }
  - { at: 10600, note: G4, vel: 100, hold: 400 }
  - { at: 11700, screenshot: tune }
expect:
  boots: true
