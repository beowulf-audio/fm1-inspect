# Steps through the pages from the help guide's control table: MIDI Monitor, the four FX pipeline pages, Event Triggers,
# Knobs Config and Metronome, Clock Monitor, Patch Select and Sysex Dump, Live Keys (played), then back to the monitor.
name: midiproc-tour
ms: 12000
click_ms: 150
steps:
  - { at: 1500, screenshot: boot }
  - { at: 2400, press: FX }
  - { at: 3000, press: FX }
  - { at: 3600, press: FX }
  - { at: 4200, press: FX }
  - { at: 4800, press: SCL }
  - { at: 5400, press: EDIT }
  - { at: 6000, press: EDIT }
  - { at: 6600, press: SEQ }
  - { at: 7200, press: SAVE }
  - { at: 7800, press: SAVE }
  - { at: 8400, press: ARP }
  - { at: 8800, note: C4, vel: 100, hold: 200 }
  - { at: 9100, note: E4, vel: 100, hold: 200 }
  - { at: 9400, note: G4, vel: 100, hold: 200 }
  - { at: 9900, press: GLO }
  - { at: 10700, press: HOME }
  - { at: 11800, screenshot: monitor }
expect:
  boots: true
