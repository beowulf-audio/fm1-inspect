# Plays notes on the mono voice while stepping through its pages (MAIN, FILTER, FILT ENV, LFO 1, UNISON), then
# PRESETS changes the patch (SAW LEAD to ACID and on) with a note or a short line on each.
name: monohull-tour
ms: 12000
click_ms: 150
steps:
  - { at: 1400, screenshot: boot }
  - { at: 1700, note: F3, hold: 700 }
  - { at: 2000, press: EDIT }
  - { at: 2500, note: G3, hold: 500 }
  - { at: 3100, press: ENV }
  - { at: 3300, note: C4, hold: 500 }
  - { at: 4000, press: LFO }
  - { at: 4200, note: D#4, hold: 500 }
  - { at: 4900, press: FX }
  - { at: 5100, note: G4, hold: 500 }
  - { at: 5800, press: HOME }
  - { at: 6100, turn: PRESETS, clicks: 3 }
  - { at: 6800, note: C4, hold: 600 }
  - { at: 7600, turn: PRESETS, clicks: 4 }
  - { at: 8300, note: G3, hold: 600 }
  - { at: 9000, turn: PRESETS, clicks: 5 }
  - { at: 9600, note: C4, hold: 300 }
  - { at: 10000, note: D#4, hold: 300 }
  - { at: 10400, note: G4, hold: 600 }
  - { at: 11800, screenshot: end }
expect:
  boots: true
