  - { at: 3200, turn: PRESETS, clicks: 1 }
  - { at: 4800, press: GLO, hold: 1400 }
  - { at: 5100, turn: PRESETS, clicks: 3 }
  - { at: 6600, turn: SELECT, clicks: 1 }
  - { at: 7400, turn: SELECT, clicks: 1 }
  - { at: 8200, turn: SELECT, clicks: 1 }
  - { at: 9000, press: HOME }
  - { at: 9700, press: HOME }
  - { at: 10300, turn: ALGORITHM, clicks: 6 }
  - { at: 12400, screenshot: end }
expect:
  boots: true
