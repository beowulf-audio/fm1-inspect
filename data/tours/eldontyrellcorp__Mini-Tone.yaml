# Multi-engine groovebox: notes on the FM6 track while PRESETS changes sound, then the EDIT (operators), ENV, LFO, FX and
# SEQ step pages, the HOME mixer and clock pages, and another preset (README "Controls", "The pages by button").
name: minitone-tour
ms: 12500
click_ms: 150
steps:
  - { at: 1500, screenshot: boot }
  - { at: 1700, note: C4, vel: 110, hold: 500 }
  - { at: 1700, note: G4, vel: 110, hold: 500 }
  - { at: 2300, turn: PRESETS, clicks: 2 }
  - { at: 2700, note: C4, vel: 110, hold: 300 }
  - { at: 3000, note: E4, vel: 110, hold: 300 }
  - { at: 3300, note: G4, vel: 110, hold: 300 }
  - { at: 3700, press: EDIT }
  - { at: 3900, note: C5, vel: 110, hold: 400 }
  - { at: 4600, press: EDIT }
  - { at: 4800, note: A4, vel: 110, hold: 400 }
  - { at: 5500, press: ENV }
  - { at: 5700, note: E4, vel: 110, hold: 500 }
  - { at: 6400, press: LFO }
  - { at: 7300, press: FX }
  - { at: 7500, note: D4, vel: 110, hold: 500 }
  - { at: 8200, press: SEQ }
  - { at: 9200, press: HOME }
  - { at: 9600, press: HOME }
  - { at: 10200, press: HOME }
  - { at: 10500, press: HOME }
  - { at: 10700, turn: PRESETS, clicks: 2 }
  - { at: 11100, note: F3, vel: 110, hold: 300 }
  - { at: 11400, note: C4, vel: 110, hold: 300 }
  - { at: 11700, note: F4, vel: 110, hold: 500 }
  - { at: 12400, screenshot: end }
expect:
  boots: true
